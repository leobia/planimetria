<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anteprima planimetria</title>
<!-- Generato da strumenti/genera_integrazione.py a partire da anteprima.template.html: modificare il template. -->
<style>
  :root {
    --bg: #17171b; --panel: #222228; --line: #34343c; --text: #ece8e1; --muted: #9a958c;
    --accent: #f2b766; --accent-ink: #2a1d08; --night: #8da2d8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center;
    padding: 14px 16px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 17px; font-weight: 600; margin: 0 auto 0 0; letter-spacing: .01em; }
  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 8px 12px;
    border-radius: 9px; font: inherit; cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; padding: 16px; max-width: 1500px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }

  .stage { position: relative; width: 100%; margin: 0 auto; border-radius: 12px; overflow: hidden; background: #1e1e1e; }
  .stage img { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; user-select: none; }
  .stage .night, .stage .light, .stage .cat { transition: opacity .45s ease, filter .45s ease; }
  .stage .night, .stage .light { opacity: 0; transition: opacity .45s ease; }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .zone { fill: transparent; stroke: transparent; stroke-width: 3; cursor: pointer; transition: stroke .15s, fill .15s; }
  .zone:hover, .zone:focus-visible { stroke: rgba(242, 183, 102, .85); fill: rgba(242, 183, 102, .06); outline: none; }
  .show-zones .zone { stroke: rgba(255, 255, 255, .55); stroke-dasharray: 8 6; }
  .hot { position: absolute; transform: translate(-50%, -50%); width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.18); background: rgba(20, 20, 24, .6); color: #cfcac2;
    display: grid; place-items: center; cursor: pointer; padding: 0; backdrop-filter: blur(3px); transition: background .2s, color .2s; }
  .hot svg { position: static; width: 20px; height: 20px; }
  .hot[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent;
    box-shadow: 0 0 18px rgba(242, 183, 102, .7); }
  @media (max-width: 600px) { .hot { width: 28px; height: 28px; } .hot svg { width: 15px; height: 15px; } }

  aside { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; align-self: start; }
  aside h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin: 14px 0 2px; font-weight: 600; }
  aside h3:first-of-type { margin-top: 0; }
  aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row .name { flex: 1; min-width: 0; }
  .row .ent { display: block; font: 12px ui-monospace, Consolas, monospace; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sw { position: relative; width: 42px; height: 24px; flex: none; border-radius: 12px; background: #3a3a43; border: 0; cursor: pointer; transition: background .2s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #d8d3cb; transition: transform .2s; }
  .sw[aria-checked="true"] { background: var(--accent); }
  .sw[aria-checked="true"]::after { transform: translateX(18px); background: #fff; }
  .sw.nightsw[aria-checked="true"] { background: var(--night); }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .opts { margin-top: 14px; display: grid; gap: 8px; font-size: 14px; color: var(--muted); }
  .opts label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .daynight { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  footer { color: var(--muted); font-size: 13px; padding: 0 16px 20px; max-width: 1500px; margin: 0 auto; }
</style>
</head>
<body>
<header>
  <h1>Planimetria · anteprima dashboard</h1>
  <div class="daynight">
    <span>Giorno</span>
    <button class="sw nightsw" id="night" role="switch" aria-checked="false" aria-label="Modalità notte"></button>
    <span>Notte</span>
  </div>
</header>
<main>
  <div class="stage" id="stage"></div>
  <aside>
    <h2>Luci</h2>
    <div id="rooms"></div>
    <div class="tools">
      <button class="btn" id="allOn">Accendi tutto</button>
      <button class="btn" id="allOff">Spegni tutto</button>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="zones"> Mostra zone cliccabili</label>
      <label><input type="checkbox" id="real"> Mostra entity_id luci (segnaposto)</label>
    </div>
  </aside>
</main>
<footer>Stessi file usati da Home Assistant (<code>www/floorplan/</code>). Clic su una stanza o sulla sua icona per accenderla; più stanze possono restare accese insieme. La gattina dorme in camera.</footer>
<script>
const DATA = {"canvas": {"width": 1500, "height": 1420}, "opacity": {"giorno": 0.6, "notte": 1.0}, "base": {"giorno": "www/floorplan/casa/base-giorno.png", "notte": "www/floorplan/casa/base-notte.png"}, "nightFilter": "brightness(45%) saturate(70%)", "cat": {"file": "www/floorplan/casa/gatta.svg", "center_px": [896, 238], "width_px": 54, "center_pct": [59.73, 16.76], "room": "camera", "night_filter_when_room_off": "brightness(45%) saturate(70%)"}, "floors": [{"id": "mansarda", "label": "Mansarda"}, {"id": "primo-piano", "label": "Primo piano"}], "rooms": [{"id": "salotto", "label": "Salotto", "floor": "primo-piano", "icon": "mdi:sofa", "overlay": "www/floorplan/casa/luce-salotto.png", "polygon_px": [[40, 1074], [440, 860], [452, 874], [642, 1124], [232, 1374], [200, 1382], [40, 1134]], "hotspot_px": [330, 1134], "entity_demo": "input_boolean.planimetria_salotto", "entity_light": "light.salotto"}, {"id": "ingresso", "label": "Ingresso e scala", "floor": "primo-piano", "icon": "mdi:stairs", "overlay": "www/floorplan/casa/luce-ingresso.png", "polygon_px": [[440, 860], [482, 836], [480, 722], [530, 710], [640, 734], [690, 764], [700, 796], [795, 912], [1044, 784], [1044, 904], [1025, 920], [642, 1124], [452, 874]], "hotspot_px": [720, 979], "entity_demo": "input_boolean.planimetria_ingresso", "entity_light": "light.ingresso"}, {"id": "cucina", "label": "Cucina", "floor": "primo-piano", "icon": "mdi:stove", "overlay": "www/floorplan/casa/luce-cucina.png", "polygon_px": [[666, 670], [980, 518], [1020, 532], [1030, 520], [1112, 572], [1120, 639], [1098, 650], [1046, 706], [1046, 782], [795, 912], [700, 796], [668, 754]], "hotspot_px": [905, 734], "entity_demo": "input_boolean.planimetria_cucina", "entity_light": "light.cucina"}, {"id": "bagno_giu", "label": "Bagno", "floor": "primo-piano", "icon": "mdi:shower", "overlay": "www/floorplan/casa/luce-bagno-giu.png", "polygon_px": [[1046, 706], [1098, 650], [1173, 622], [1240, 664], [1260, 734], [1258, 756], [1108, 814], [1100, 779], [1046, 782]], "hotspot_px": [1165, 719], "entity_demo": "input_boolean.planimetria_bagno_giu", "entity_light": "light.bagno_primo_piano"}, {"id": "studio_giu", "label": "Studio", "floor": "primo-piano", "icon": "mdi:desk", "overlay": "www/floorplan/casa/luce-studio-giu.png", "polygon_px": [[1044, 784], [1100, 779], [1108, 814], [1258, 756], [1298, 724], [1372, 770], [1374, 842], [1458, 922], [1208, 1066], [1022, 916], [1044, 904]], "hotspot_px": [1235, 964], "entity_demo": "input_boolean.planimetria_studio_giu", "entity_light": "light.studio_primo_piano"}, {"id": "studio_su", "label": "Studio", "floor": "mansarda", "icon": "mdi:desk", "overlay": "www/floorplan/casa/luce-studio-su.png", "polygon_px": [[40, 519], [296, 380], [296, 346], [376, 294], [420, 314], [452, 346], [652, 572], [240, 859], [44, 649]], "hotspot_px": [330, 614], "entity_demo": "input_boolean.planimetria_studio_su", "entity_light": "light.studio_mansarda"}, {"id": "pianerottolo", "label": "Pianerottolo", "floor": "mansarda", "icon": "mdi:stairs", "overlay": "www/floorplan/casa/luce-pianerottolo.png", "polygon_px": [[420, 332], [665, 216], [690, 230], [694, 346], [750, 428], [806, 404], [818, 422], [882, 452], [902, 442], [652, 572], [452, 346]], "hotspot_px": [600, 434], "entity_demo": "input_boolean.planimetria_pianerottolo", "entity_light": "light.pianerottolo"}, {"id": "camera", "label": "Camera", "floor": "mansarda", "icon": "mdi:bed", "overlay": "www/floorplan/casa/luce-camera.png", "polygon_px": [[665, 216], [986, 20], [1215, 206], [1240, 224], [1200, 256], [1140, 221], [1120, 208], [1048, 210], [1046, 294], [1050, 336], [1000, 366], [902, 442], [882, 452], [818, 422], [806, 404], [750, 428], [694, 346], [690, 230]], "hotspot_px": [930, 254], "entity_demo": "input_boolean.planimetria_camera", "entity_light": "light.camera"}, {"id": "bagno_su", "label": "Bagno", "floor": "mansarda", "icon": "mdi:shower", "overlay": "www/floorplan/casa/luce-bagno-su.png", "polygon_px": [[1046, 294], [1048, 210], [1120, 208], [1140, 221], [1308, 338], [1308, 346], [1197, 422]], "hotspot_px": [1185, 354], "entity_demo": "input_boolean.planimetria_bagno_su", "entity_light": "light.bagno_mansarda"}, {"id": "ripostiglio", "label": "Ripostiglio", "floor": "mansarda", "icon": "mdi:archive", "overlay": "www/floorplan/casa/luce-ripostiglio.png", "polygon_px": [[1200, 256], [1248, 229], [1248, 184], [1272, 172], [1402, 279], [1430, 346], [1308, 414], [1308, 348]], "hotspot_px": [1350, 319], "entity_demo": "input_boolean.planimetria_ripostiglio", "entity_light": "light.ripostiglio"}]};
const BULB = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-4 12.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26A7 7 0 0 0 12 2Zm-3 18a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1v-1H9v1Z"/></svg>';
const state = { night: false, on: {} };
try { Object.assign(state, JSON.parse(localStorage.getItem('planimetria-casa') || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem('planimetria-casa', JSON.stringify(state)); } catch (e) {} };

const $ = (id) => document.getElementById(id);
const W = DATA.canvas.width, H = DATA.canvas.height;
const stage = $('stage'), roomsEl = $('rooms');
stage.style.aspectRatio = W + ' / ' + H;
stage.style.maxWidth = `calc((100vh - 110px) * ${W / H})`;

function toggle(id) { state.on[id] = !state.on[id]; update(); }

function render() {
  const add = (cls, src, id) => { const i = new Image(); i.className = cls; i.src = src; i.alt = ''; if (id) i.dataset.room = id; stage.append(i); return i; };
  add('day', DATA.base.giorno);
  add('night', DATA.base.notte);
  DATA.rooms.forEach(r => add('light', r.overlay, r.id));

  const c = DATA.cat, cat = add('cat', c.file);
  cat.style.inset = 'auto';
  cat.alt = 'Gattina tigrata grigia';
  Object.assign(cat.style, {
    left: (c.center_px[0] - c.width_px / 2) / W * 100 + '%',
    top: (c.center_px[1] - c.width_px * 0.375) / H * 100 + '%',
    width: c.width_px / W * 100 + '%', height: 'auto',
  });

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  DATA.rooms.forEach(r => {
    const p = document.createElementNS(svg.namespaceURI, 'polygon');
    p.setAttribute('points', r.polygon_px.map(q => q.join(',')).join(' '));
    p.setAttribute('class', 'zone'); p.setAttribute('tabindex', '0'); p.setAttribute('role', 'button');
    p.setAttribute('aria-label', r.label);
    p.onclick = () => toggle(r.id);
    p.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(r.id); } };
    svg.append(p);
  });
  stage.append(svg);

  DATA.rooms.forEach(r => {
    const b = document.createElement('button');
    b.className = 'hot'; b.innerHTML = BULB; b.dataset.room = r.id; b.title = r.label;
    b.style.left = (r.hotspot_px[0] / W * 100) + '%'; b.style.top = (r.hotspot_px[1] / H * 100) + '%';
    b.onclick = () => toggle(r.id);
    stage.append(b);
  });

  DATA.floors.forEach(f => {
    const h = document.createElement('h3'); h.textContent = f.label; roomsEl.append(h);
    DATA.rooms.filter(r => r.floor === f.id).forEach(r => {
      const row = document.createElement('div'); row.className = 'row';
      row.innerHTML = `<span class="name">${r.label}<span class="ent"></span></span>`;
      const sw = document.createElement('button');
      sw.className = 'sw'; sw.setAttribute('role', 'switch'); sw.setAttribute('aria-label', r.label); sw.dataset.room = r.id;
      sw.onclick = () => toggle(r.id);
      row.append(sw); row.dataset.room = r.id; roomsEl.append(row);
    });
  });
  update();
}

function update() {
  const op = state.night ? DATA.opacity.notte : DATA.opacity.giorno;
  stage.querySelector('img.night').style.opacity = state.night ? 1 : 0;
  DATA.rooms.forEach(r => {
    const on = !!state.on[r.id];
    stage.querySelector(`img.light[data-room="${r.id}"]`).style.opacity = on ? op : 0;
    stage.querySelector(`.hot[data-room="${r.id}"]`).setAttribute('aria-pressed', on);
    roomsEl.querySelector(`.sw[data-room="${r.id}"]`).setAttribute('aria-checked', on);
    roomsEl.querySelector(`.row[data-room="${r.id}"] .ent`).textContent = $('real').checked ? r.entity_light : r.entity_demo;
  });
  stage.querySelector('img.cat').style.filter = state.night && !state.on[DATA.cat.room] ? DATA.nightFilter : 'none';
  $('night').setAttribute('aria-checked', state.night);
  stage.classList.toggle('show-zones', $('zones').checked);
  save();
}

$('night').onclick = () => { state.night = !state.night; update(); };
$('allOn').onclick = () => { DATA.rooms.forEach(r => state.on[r.id] = true); update(); };
$('allOff').onclick = () => { DATA.rooms.forEach(r => state.on[r.id] = false); update(); };
$('zones').onchange = update;
$('real').onchange = update;
render();
</script>
</body>
</html>
