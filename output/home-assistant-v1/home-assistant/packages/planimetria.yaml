# Pacchetto Home Assistant per la planimetria interattiva.
# Generato da strumenti/genera_integrazione.py.
# Copiare in /config/packages/ e abilitare i pacchetti in configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages

input_boolean:
  planimetria_notte:
    name: Planimetria modalità notte
    icon: mdi:weather-night
  # Interruttori dimostrativi: sostituiti dalle luci reali in dashboard-planimetria-luci.yaml
  planimetria_salotto:
    name: Demo luce salotto (primo piano)
    icon: mdi:sofa
  planimetria_ingresso:
    name: Demo luce ingresso e scala (primo piano)
    icon: mdi:stairs
  planimetria_cucina:
    name: Demo luce cucina (primo piano)
    icon: mdi:stove
  planimetria_bagno_giu:
    name: Demo luce bagno (primo piano)
    icon: mdi:shower
  planimetria_studio_giu:
    name: Demo luce studio (primo piano)
    icon: mdi:desk
  planimetria_studio_su:
    name: Demo luce studio (mansarda)
    icon: mdi:desk
  planimetria_pianerottolo:
    name: Demo luce pianerottolo (mansarda)
    icon: mdi:stairs
  planimetria_camera:
    name: Demo luce camera (mansarda)
    icon: mdi:bed
  planimetria_bagno_su:
    name: Demo luce bagno (mansarda)
    icon: mdi:shower
  planimetria_ripostiglio:
    name: Demo luce ripostiglio (mansarda)
    icon: mdi:archive

automation:
  - id: planimetria_notte_al_tramonto
    alias: Planimetria - notte al tramonto
    triggers:
      - trigger: sun
        event: sunset
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.planimetria_notte
  - id: planimetria_giorno_all_alba
    alias: Planimetria - giorno all'alba
    triggers:
      - trigger: sun
        event: sunrise
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.planimetria_notte
