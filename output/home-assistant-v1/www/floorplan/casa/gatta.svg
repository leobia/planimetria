<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="120" height="90">
  <!-- Gattina tigrata grigia acciambellata che dorme. Respiro lento animato (SMIL, funziona anche come <img>). -->
  <defs>
    <radialGradient id="pelo" cx="42%" cy="35%" r="70%">
      <stop offset="0" stop-color="#d6d2cc"/>
      <stop offset=".55" stop-color="#a19c96"/>
      <stop offset="1" stop-color="#6f6a65"/>
    </radialGradient>
    <radialGradient id="testa" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#dcd8d2"/>
      <stop offset=".6" stop-color="#a8a39d"/>
      <stop offset="1" stop-color="#74706b"/>
    </radialGradient>
    <filter id="sfuma" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>

  <ellipse cx="60" cy="66" rx="47" ry="15" fill="#1e1e22" opacity=".28" filter="url(#sfuma)"/>

  <g transform="translate(58 66)"><g>
    <animateTransform attributeName="transform" type="scale" values="1 1;1.025 1.035;1 1"
      dur="3.6s" repeatCount="indefinite" additive="sum"
      calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
    <g transform="translate(-58 -66)">
      <!-- corpo -->
      <path d="M14 52 C12 32 34 20 56 21 C80 22 98 32 99 48 C100 64 80 72 56 72 C33 72 15 66 14 52 Z"
        fill="url(#pelo)" stroke="#3b3734" stroke-width="1.2"/>
      <!-- strisce sul dorso -->
      <g fill="none" stroke="#3f3a36" stroke-linecap="round" opacity=".85">
        <path d="M27 30 C31 38 30 46 25 53" stroke-width="3.2"/>
        <path d="M38 24 C43 33 43 43 38 51" stroke-width="3.4"/>
        <path d="M50 22 C55 31 56 41 52 49" stroke-width="3.4"/>
        <path d="M62 22 C67 30 68 39 65 46" stroke-width="3.2"/>
        <path d="M73 25 C77 31 78 38 76 43" stroke-width="2.8"/>
        <path d="M20 40 C22 45 21 50 18 54" stroke-width="2.4"/>
      </g>
      <!-- coda che avvolge il davanti -->
      <path d="M20 60 C26 74 52 79 74 74 C82 72 86 69 88 66"
        fill="none" stroke="#3b3734" stroke-width="11" stroke-linecap="round"/>
      <path d="M20 60 C26 74 52 79 74 74 C82 72 86 69 88 66"
        fill="none" stroke="#a8a39d" stroke-width="8.6" stroke-linecap="round"/>
      <path d="M24 66 C30 73 52 77 74 73 C80 71.5 84 69.5 86 67.5"
        fill="none" stroke="#3f3a36" stroke-width="8.6" stroke-dasharray="4 6" opacity=".8"/>
      <circle cx="88" cy="66" r="4.2" fill="#34302d"/>
      <!-- zampette -->
      <ellipse cx="70" cy="66" rx="6" ry="3.6" fill="#ece8e2" stroke="#8a857f" stroke-width=".8"/>
      <ellipse cx="80" cy="64.5" rx="5.2" ry="3.2" fill="#ece8e2" stroke="#8a857f" stroke-width=".8"/>
      <!-- orecchie -->
      <path d="M76 42 L80 25 L90 37 Z" fill="#9b968f" stroke="#3b3734" stroke-width="1.1" stroke-linejoin="round"/>
      <path d="M79.5 38 L81 30 L86 36 Z" fill="#f2b0a0"/>
      <path d="M95 36 L105 23 L108 41 Z" fill="#9b968f" stroke="#3b3734" stroke-width="1.1" stroke-linejoin="round"/>
      <path d="M98.5 35.5 L104 28 L105.5 38 Z" fill="#f2b0a0"/>
      <!-- testa appoggiata sulle zampe -->
      <ellipse cx="92" cy="50" rx="17.5" ry="14.5" fill="url(#testa)" stroke="#3b3734" stroke-width="1.2"/>
      <!-- "M" tigrata sulla fronte -->
      <g fill="none" stroke="#3f3a36" stroke-linecap="round" stroke-width="1.8">
        <path d="M86 38.5 L88 44"/>
        <path d="M91.5 37 L92 43.5"/>
        <path d="M97 38 L95.5 44"/>
        <path d="M77 47 C79 47.5 80.5 48.5 81.5 50" stroke-width="1.5"/>
        <path d="M107.5 46.5 C105.5 47 104 48 103 49.5" stroke-width="1.5"/>
      </g>
      <!-- muso chiaro -->
      <ellipse cx="92.5" cy="56.5" rx="8.5" ry="6" fill="#efebe5"/>
      <!-- occhi chiusi -->
      <g fill="none" stroke="#4a2410" stroke-width="1.5" stroke-linecap="round">
        <path d="M83 50 C85 52 88 52 89.5 50"/>
        <path d="M95.5 50 C97 52 100 52 102 50"/>
      </g>
      <!-- naso e bocca -->
      <path d="M90.6 54.2 L94.4 54.2 L92.5 56.4 Z" fill="#d9777a"/>
      <path d="M92.5 56.4 C92.5 58 91 58.6 89.6 58 M92.5 56.4 C92.5 58 94 58.6 95.4 58"
        fill="none" stroke="#7a4028" stroke-width=".9" stroke-linecap="round"/>
      <!-- baffi -->
      <g stroke="#fff6ea" stroke-width=".7" stroke-linecap="round" opacity=".9">
        <path d="M86 56 L74 54"/><path d="M86 57.5 L74.5 58.5"/>
        <path d="M99 56 L111 54"/><path d="M99 57.5 L110.5 58.5"/>
      </g>
    </g>
  </g></g>
</svg>
